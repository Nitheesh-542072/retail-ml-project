version: 2

sources:
  - name: raw
    database: RETAIL_INTELLIGENCE_DEV
    schema: RAW

    tables:
      # Structured CSV Tables
      - name: products_raw
        description: "Raw products catalog master data"
      - name: locations_raw
        description: "Raw fulfillment locations (DCs, stores, 3PLs)"
      - name: suppliers_raw
        description: "Raw supplier procurement profiles and terms"
      - name: carriers_raw
        description: "Raw logistics carriers and transit rate matrix"
      - name: calendar_raw
        description: "Raw retail operating calendar, holidays, and peak periods"
      - name: inventory_snapshots_raw
        description: "Raw daily physical inventory snapshot balances"
      - name: inventory_movements_raw
        description: "Raw warehouse and store inventory transaction logs"
      - name: sales_demand_raw
        description: "Raw daily multi-channel sales demand and returns"
      - name: transfers_raw
        description: "Raw inter-facility stock transfer movements"

      # Semi-structured JSON Tables
      - name: promotions_raw
        description: "Raw promotional campaigns and discount terms"
      - name: purchase_orders_raw
        description: "Raw supplier purchase orders and receiving logs"
      - name: customer_orders_raw
        description: "Raw customer online orders and item lines"
      - name: shipments_raw
        description: "Raw fulfillment shipments and tracking timelines"

models:
  # 1. Products
  - name: products
    description: "Bronze typed product catalog master table"
    columns:
      - name: sku_id
        description: "Stock Keeping Unit unique identifier"
      - name: product_name
      - name: category
      - name: abc_class
      - name: unit_cost
      - name: unit_price
      - name: status

  # 2. Locations
  - name: locations
    description: "Bronze typed fulfillment nodes (DCs, retail stores, 3PLs)"
    columns:
      - name: location_id
        description: "Facility node unique identifier"
      - name: location_type
      - name: region

  # 3. Suppliers
  - name: suppliers
    description: "Bronze supplier terms, MOQs, and lead time commitments"
    columns:
      - name: supplier_id
      - name: sku_id
      - name: promised_lead_time_days

  # 4. Carriers
  - name: carriers
    description: "Bronze freight carrier rate matrix and delivery SLAs"
    columns:
      - name: carrier_id
      - name: service_level

  # 5. Calendar
  - name: calendar
    description: "Bronze operating calendar with peak period indicators"
    columns:
      - name: calendar_date
      - name: is_holiday
      - name: is_peak_period

  # 6. Inventory Snapshots
  - name: inventory_snapshots
    description: "Bronze daily inventory snapshot counts per facility and SKU"
    columns:
      - name: snapshot_date
      - name: sku_id
      - name: location_id
      - name: on_hand_qty
      - name: available_qty
      - name: is_stockout

  # 7. Inventory Movements
  - name: inventory_movements
    description: "Bronze granular stock transaction movement events"
    columns:
      - name: movement_id
      - name: sku_id
      - name: location_id
      - name: movement_type

  # 8. Sales Demand
  - name: sales_demand
    description: "Bronze daily retail demand and channel returns"
    columns:
      - name: sales_date
      - name: sku_id
      - name: location_id
      - name: channel
      - name: units_sold

  # 9. Transfers
  - name: transfers
    description: "Bronze inter-facility stock transfer events"
    columns:
      - name: transfer_id
      - name: from_location_id
      - name: to_location_id
      - name: sku_id
      - name: status

  # 10. Promotions
  - name: promotions
    description: "Bronze promotional campaigns and SKU eligibility"
    columns:
      - name: promo_id
      - name: sku_id
      - name: promo_type
      - name: discount_pct

  # 11. Purchase Orders
  - name: purchase_orders
    description: "Bronze inbound purchase orders and warehouse receiving lines"
    columns:
      - name: po_id
      - name: supplier_id
      - name: destination_location_id
      - name: sku_id
      - name: ordered_qty
      - name: unit_cost
      - name: order_date
      - name: status

  # 12. Customer Orders
  - name: customer_orders
    description: "Bronze customer online orders with delivery promises flattened per item"
    columns:
      - name: order_id
      - name: customer_id
      - name: sku_id
      - name: qty
      - name: promised_delivery_date
      - name: service_level
      - name: fulfilled_from_location_id
      - name: order_status

  # 13. Shipments
  - name: shipments
    description: "Bronze outbound shipment events and transit SLA compliance flattened per event"
    columns:
      - name: shipment_id
      - name: order_id
      - name: origin_location_id
      - name: carrier_id
      - name: service_level
      - name: event_type
      - name: is_late
