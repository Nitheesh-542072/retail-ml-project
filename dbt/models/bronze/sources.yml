version: 2

sources:
  - name: raw
    database: RETAIL_INTELLIGENCE_DEV
    schema: RAW

    tables:
      # Structured CSV Tables
      - name: products_raw
        description: "Raw products catalog master data"
      - name: locations_raw
        description: "Raw fulfillment locations (DCs, stores, 3PLs)"
      - name: suppliers_raw
        description: "Raw supplier procurement profiles and terms"
      - name: carriers_raw
        description: "Raw logistics carriers and transit rate matrix"
      - name: calendar_raw
        description: "Raw retail operating calendar, holidays, and peak periods"
      - name: inventory_snapshots_raw
        description: "Raw daily physical inventory snapshot balances"
      - name: inventory_movements_raw
        description: "Raw warehouse and store inventory transaction logs"
      - name: sales_demand_raw
        description: "Raw daily multi-channel sales demand and returns"
      - name: transfers_raw
        description: "Raw inter-facility stock transfer movements"

      # Semi-structured JSON Tables
      - name: promotions_raw
        description: "Raw promotional campaigns and discount terms"
      - name: purchase_orders_raw
        description: "Raw supplier purchase orders and receiving logs"
      - name: customer_orders_raw
        description: "Raw customer online orders and item lines"
      - name: shipments_raw
        description: "Raw fulfillment shipments and tracking timelines"

models:
  # 1. Products
  - name: tbl_products
    description: "Bronze typed product catalog master table"
    columns:
      - name: sku_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: abc_class
        tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C']
      - name: unit_cost
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['NEW', 'ACTIVE', 'DISCONTINUED']

  # 2. Locations
  - name: tbl_locations
    description: "Bronze typed fulfillment nodes (DCs, retail stores, 3PLs)"
    columns:
      - name: location_id
        tests:
          - unique
          - not_null
      - name: location_type
        tests:
          - not_null
          - accepted_values:
              values: ['DC', 'STORE', '3PL']
      - name: region
        tests:
          - not_null

  # 3. Suppliers
  - name: tbl_suppliers
    description: "Bronze supplier terms, MOQs, and lead time commitments"
    columns:
      - name: supplier_id
        tests:
          - not_null
      - name: sku_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_products')
              field: sku_id
      - name: promised_lead_time_days
        tests:
          - not_null

  # 4. Carriers
  - name: tbl_carriers
    description: "Bronze shipping carriers and service level SLAs"
    columns:
      - name: carrier_id
        tests:
          - unique
          - not_null
      - name: service_level
        tests:
          - not_null
          - accepted_values:
              values: ['SAME_DAY', 'NEXT_DAY', 'STANDARD']

  # 5. Calendar
  - name: tbl_calendar
    description: "Bronze operating calendar and peak retail seasons"
    columns:
      - name: calendar_date
        tests:
          - unique
          - not_null
      - name: is_holiday
        tests:
          - not_null
      - name: is_peak_period
        tests:
          - not_null

  # 6. Inventory Snapshots
  - name: tbl_inventory_snapshots
    description: "Bronze daily SKU-location stock balances and stockout tracking"
    columns:
      - name: snapshot_date
        tests:
          - not_null
      - name: sku_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_products')
              field: sku_id
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: on_hand_qty
        tests:
          - not_null
      - name: available_qty
        tests:
          - not_null
      - name: is_stockout
        tests:
          - not_null

  # 7. Inventory Movements
  - name: tbl_inventory_movements
    description: "Bronze physical stock transaction ledger"
    columns:
      - name: movement_id
        tests:
          - unique
          - not_null
      - name: sku_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_products')
              field: sku_id
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: movement_type
        tests:
          - not_null
          - accepted_values:
              values: ['RECEIPT', 'SALE', 'TRANSFER_IN', 'TRANSFER_OUT', 'RETURN', 'ADJUSTMENT', 'WRITE_OFF']

  # 8. Sales Demand
  - name: tbl_sales_demand
    description: "Bronze daily unit demand and revenue per SKU, location, and channel"
    columns:
      - name: sales_date
        tests:
          - not_null
      - name: sku_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_products')
              field: sku_id
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['IN_STORE', 'WEB', 'APP']
      - name: units_sold
        tests:
          - not_null

  # 9. Transfers
  - name: tbl_transfers
    description: "Bronze stock transfers between DCs and retail stores"
    columns:
      - name: transfer_id
        tests:
          - unique
          - not_null
      - name: from_location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: to_location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: sku_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_products')
              field: sku_id
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['COMPLETED', 'IN_TRANSIT', 'CANCELLED']

  # 10. Promotions
  - name: tbl_promotions
    description: "Bronze promotional offers and discount schedules"
    columns:
      - name: promo_id
        tests:
          - unique
          - not_null
      - name: promo_type
        tests:
          - not_null
      - name: discount_pct
        tests:
          - not_null

  # 11. Purchase Orders
  - name: tbl_purchase_orders
    description: "Bronze procurement orders and supplier lead time performance"
    columns:
      - name: po_id
        tests:
          - unique
          - not_null
      - name: supplier_id
        tests:
          - not_null
      - name: destination_location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: order_date
        tests:
          - not_null
      - name: po_status
        tests:
          - not_null
          - accepted_values:
              values: ['RECEIVED', 'OPEN', 'PARTIAL', 'CANCELLED']

  # 12. Customer Orders
  - name: tbl_customer_orders
    description: "Bronze customer online orders with delivery promises and masked PII"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: promised_delivery_date
        tests:
          - not_null
      - name: service_level
        tests:
          - not_null
          - accepted_values:
              values: ['SAME_DAY', 'NEXT_DAY', 'STANDARD']
      - name: fulfilled_from_location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['DELIVERED', 'SHIPPED', 'PACKED', 'CREATED', 'CANCELLED']

  # 13. Shipments
  - name: tbl_shipments
    description: "Bronze outbound shipment events and transit SLA compliance"
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: origin_location_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_locations')
              field: location_id
      - name: carrier_id
        tests:
          - not_null
          - relationships:
              to: ref('tbl_carriers')
              field: carrier_id
      - name: service_level
        tests:
          - not_null
          - accepted_values:
              values: ['SAME_DAY', 'NEXT_DAY', 'STANDARD']
      - name: is_late
        tests:
          - not_null
